services:
  - type: web
    name: freelance-marketplace-backend
    runtime: node
    plan: free
    buildCommand: npm install --prefix backend
    startCommand: node backend/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: ENABLE_SOCKET_IO
        value: "true"
