version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freelance-marketplace-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/HIREWORK
      - CLIENT_URL=http://localhost:5000
      - JWT_SECRET=change_this_to_a_secure_random_string_in_production
      - ENABLE_SOCKET_IO=true
    depends_on:
      - mongo
    volumes:
      - uploads_data:/app/backend/uploads

  mongo:
    image: mongo:7.0
    container_name: freelance-marketplace-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  uploads_data:
